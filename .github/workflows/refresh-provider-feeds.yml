name: Refresh Specta EPG

on:
  push:
    paths:
      - ".github/workflows/refresh-provider-feeds.yml"
      - "providers/**"
      - "data/mapping/channel-map.csv"
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-specta-epg
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Refresh beIN MENA official guide
        working-directory: providers/bein_mena
        env:
          EPG_DAYS: "5"
          REQUEST_DELAY_MS: "500"
          EPG_OUTPUT: "../../data/source-feeds/bein_mena.json"
        run: npm run scrape
      - name: Refresh SNRT official guide
        env:
          REQUEST_DELAY_MS: "350"
          EPG_OUTPUT: "data/source-feeds/snrt_ma.json"
        run: node providers/snrt_ma/scraper.mjs
      - name: Refresh SuperSport official schedule
        run: |
          python providers/supersport/scraper.py \
            --date "$(date -u +%F)" \
            --days 5 \
            --output data/review/supersport_unclassified.csv \
            --json-output data/review/supersport_unclassified.json
      - name: Refresh Sky Sports UK schedule
        run: node providers/sky/scraper.mjs "$(date -u +%F)" 5 data/review/sky_uk_unclassified.json
      - name: Refresh onTVnow UK sports XMLTV
        run: python providers/ontvnow/scraper.py --output data/review/ontvnow_uk_unclassified.json
      - name: Refresh CANAL+ France guide
        run: node providers/canalplus_fr/scraper.mjs data/review/canalplus_fr_unclassified.json
      - name: Build app-facing XMLTV from Specta registry
        run: node aggregate/build.mjs --require
      - name: Commit refreshed feeds and reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/source-feeds/bein_mena.json data/source-feeds/snrt_ma.json data/review/supersport_unclassified.json data/review/supersport_unclassified.csv data/review/sky_uk_unclassified.json data/review/canalplus_fr_unclassified.json data/review/ontvnow_uk_unclassified.json docs
          if git diff --staged --quiet; then
            echo "No provider feed changes"
          else
            git commit -m "Refresh Specta EPG schedules"
            git push
          fi
