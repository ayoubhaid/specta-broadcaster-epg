name: Refresh Specta EPG

on:
  push:
    paths:
      - ".github/workflows/refresh-provider-feeds.yml"
      - "providers/**"
      - "data/mapping/channel-map.csv"
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-specta-epg
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Refresh beIN MENA official guide
        working-directory: providers/bein_mena
        env:
          EPG_DAYS: "5"
          REQUEST_DELAY_MS: "500"
          EPG_OUTPUT: "../../data/source-feeds/bein_mena.json"
        run: npm run scrape
      - name: Refresh beIN France
        working-directory: providers/bein_mena
        env:
          BEIN_PROVIDER: bein_fr
          BEIN_PROVIDER_NAME: beIN SPORTS France
          BEIN_REGION: fr-fr
          BEIN_SOURCE_URL: https://www.beinsports.com/fr-fr/tv-guide
          EPG_DAYS: "5"
          REQUEST_DELAY_MS: "500"
          EPG_OUTPUT: "../../data/source-feeds/bein_fr.json"
        run: npm run scrape
      - name: Refresh beIN US
        working-directory: providers/bein_mena
        env:
          BEIN_PROVIDER: bein_us
          BEIN_PROVIDER_NAME: beIN SPORTS US
          BEIN_REGION: en-us
          BEIN_SOURCE_URL: https://www.beinsports.com/en-us/tv-guide
          EPG_DAYS: "5"
          REQUEST_DELAY_MS: "500"
          EPG_OUTPUT: "../../data/source-feeds/bein_us.json"
        run: npm run scrape
      - name: Refresh beIN Australia
        working-directory: providers/bein_mena
        env:
          BEIN_PROVIDER: bein_au
          BEIN_PROVIDER_NAME: beIN SPORTS Australia
          BEIN_REGION: en-au
          BEIN_SOURCE_URL: https://www.beinsports.com/en-au/tv-guide
          EPG_DAYS: "5"
          REQUEST_DELAY_MS: "500"
          EPG_OUTPUT: "../../data/source-feeds/bein_au.json"
        run: npm run scrape
      - name: Refresh SNRT official guide
        env:
          REQUEST_DELAY_MS: "350"
          EPG_OUTPUT: "data/source-feeds/snrt_ma.json"
        run: node providers/snrt_ma/scraper.mjs
      - name: Refresh SuperSport official schedule
        run: |
          python providers/supersport/scraper.py \
            --date "$(date -u +%F)" \
            --days 5 \
            --output data/review/supersport_unclassified.csv \
            --json-output data/review/supersport_unclassified.json
      - name: Refresh Sky Sports UK schedule
        run: node providers/sky/scraper.mjs "$(date -u +%F)" 5 data/review/sky_uk_unclassified.json
      - name: Refresh CANAL+ France guide
        run: node providers/canalplus_fr/scraper.mjs data/review/canalplus_fr_unclassified.json
      - name: Refresh onTVnow UK listings
        run: |
          python providers/ontvnow/scraper.py \
            --output data/review/ontvnow_uk_unclassified.json \
            --summary-output data/review/ontvnow_uk_summary.json
      - name: Refresh elCinema Arabic guide
        run: python providers/elcinema/scraper.py --output data/review/elcinema_ar_unclassified.json
      - name: Refresh Golf Channel US
        env:
          EPG_OUTPUT: data/review/golfchannel_us_unclassified.json
        run: node providers/golfchannel/scraper.mjs
      - name: Refresh DAZN
        env:
          EPG_OUTPUT: data/review/dazn_unclassified.json
        run: node providers/dazn/scraper.mjs
      - name: Build app-facing XMLTV from Specta registry
        run: node aggregate/build.mjs --require
      - name: Commit refreshed feeds and reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/source-feeds/bein_mena.json data/source-feeds/bein_fr.json data/source-feeds/bein_us.json data/source-feeds/bein_au.json data/source-feeds/snrt_ma.json data/review/supersport_unclassified.json data/review/supersport_unclassified.csv data/review/sky_uk_unclassified.json data/review/canalplus_fr_unclassified.json data/review/ontvnow_uk_summary.json data/review/elcinema_ar_unclassified.json data/review/golfchannel_us_unclassified.json data/review/dazn_unclassified.json docs
          if git diff --staged --quiet; then
            echo "No provider feed changes"
          else
            git commit -m "Refresh Specta EPG schedules"
            git push
          fi
