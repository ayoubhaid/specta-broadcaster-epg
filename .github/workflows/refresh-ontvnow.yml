name: Refresh onTVnow UK TV Listings

on:
  push:
    paths:
      - ".github/workflows/refresh-ontvnow.yml"
      - "providers/ontvnow/**"
  schedule:
    - cron: "41 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-ontvnow-uk-listings
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test onTVnow adapter
        run: python -m unittest discover -s providers/ontvnow -p 'test_*.py'
      - name: Refresh onTVnow UK XMLTV listings
        run: python providers/ontvnow/scraper.py --output data/review/ontvnow_uk_unclassified.json
      - name: Validate feed and generate channel inventory
        run: |
          python - <<'PY'
          import csv, json
          from pathlib import Path
          feed = json.loads(Path("data/review/ontvnow_uk_unclassified.json").read_text(encoding="utf-8"))
          channels = feed["channels"]
          assert feed["schemaVersion"] == 1
          assert feed["provider"] == "ontvnow_uk"
          assert feed["coverage"]["channelsFound"] == len(channels)
          assert feed["coverage"]["programmesFound"] == sum(len(c["programmes"]) for c in channels)
          assert feed["coverage"]["programmesFound"] > 0
          out = Path("data/review/ontvnow_uk_channel_inventory.csv")
          out.parent.mkdir(parents=True, exist_ok=True)
          with out.open("w", newline="", encoding="utf-8") as handle:
              writer = csv.writer(handle)
              writer.writerow(["source_channel_id", "source_channel_name", "programme_count", "review_status"])
              for channel in sorted(channels, key=lambda c: c["name"].casefold()):
                  writer.writerow([channel["id"], channel["name"], len(channel["programmes"]), "unreviewed"])
          print(f"Validated {len(channels)} source channels / {feed['coverage']['programmesFound']} programmes")
          print(f"Wrote channel inventory: {out}")
          PY
      - name: Commit refreshed review data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/review/ontvnow_uk_unclassified.json data/review/ontvnow_uk_channel_inventory.csv
          if git diff --staged --quiet; then
            echo "No onTVnow review data changes"
          else
            git commit -m "Refresh onTVnow UK listings and channel inventory"
            git push
          fi
