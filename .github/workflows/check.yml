name: Validate Specta EPG

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check JavaScript adapters and aggregation
        run: npm run check
      - name: Check beIN scraper
        working-directory: providers/bein_mena
        run: npm run check
      - name: Test JavaScript adapters and aggregation
        run: npm test
      - name: Test SuperSport adapter
        run: python -m unittest discover -s providers/supersport -p 'test_*.py'
      - name: Test onTVnow adapter
        run: python -m unittest discover -s providers/ontvnow -p 'test_*.py'
      - name: Build feed into a scratch directory
        run: node aggregate/build.mjs --out=tmp/epg.xml --report=tmp/coverage.json --require
      - name: Validate committed source feeds
        run: |
          node --input-type=module -e "import {readFile} from 'node:fs/promises'; for (const p of ['data/source-feeds/bein_mena.json','data/source-feeds/snrt_ma.json','data/review/supersport_unclassified.json','data/review/sky_uk_unclassified.json','data/review/canalplus_fr_unclassified.json']) { const d=JSON.parse(await readFile(p,'utf8')); if(d.schemaVersion!==1) throw Error(p+' schemaVersion'); const n=d.channels.reduce((s,c)=>s+c.programmes.length,0); if(n!==d.coverage.programmesFound) throw Error(p+' coverage count'); for(const c of d.channels) for(const x of c.programmes) if(Date.parse(x.start)>=Date.parse(x.end)) throw Error(p+' invalid time range in '+c.id); console.log(p+': '+d.channels.length+' channels, '+n+' programmes') }"
