name: Validate provider feeds

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check beIN scraper syntax
        working-directory: providers/bein_mena
        run: npm run check
      - name: Check SNRT scraper syntax
        run: node --check providers/snrt_ma/scraper.mjs
      - name: Test JavaScript broadcaster adapters
        run: node --test providers/sky/test_scraper.mjs providers/canalplus_fr/test_scraper.mjs providers/snrt_ma/test_scraper.mjs providers/alkass/test_scraper.mjs providers/dubai_sports/test_scraper.mjs providers/sporttv_pt/test_scraper.mjs providers/foxsports_au/test_scraper.mjs
      - name: Test SuperSport adapter
        run: python -m unittest discover -s providers/supersport -p 'test_*.py'
      - name: Check aggregation pipeline syntax
        run: node --check aggregate/build.mjs
      - name: Test aggregation pipeline
        run: node --test aggregate/test/schedule.test.mjs aggregate/test/mapping.test.mjs aggregate/test/registry.test.mjs aggregate/test/pipeline.test.mjs aggregate/test/xmltv.test.mjs
      - name: Build feed into a scratch directory
        run: node aggregate/build.mjs --out=tmp/epg.xml --report=tmp/coverage.json
      - name: Validate committed provider feeds
        run: |
          node --input-type=module <<'NODE'
          import { readFile, access } from 'node:fs/promises';
          const candidates = [
            'data/source-feeds/bein_mena.json',
            'data/source-feeds/snrt_ma.json',
            'data/review/supersport_unclassified.json',
            'data/review/sky_uk_unclassified.json',
            'data/review/canalplus_fr_unclassified.json',
            'data/review/alkass_qa_unclassified.json',
            'data/review/sporttv_pt_unclassified.json',
            'data/review/foxsports_au_unclassified.json'
          ];
          let checked = 0;
          for (const path of candidates) {
            try { await access(path); }
            catch { console.log(`SKIP ${path}: generated review artifact is not committed`); continue; }
            const doc = JSON.parse(await readFile(path, 'utf8'));
            if (doc.schemaVersion !== 1) throw new Error(`${path}: unsupported schemaVersion`);
            if (!Array.isArray(doc.channels)) throw new Error(`${path}: channels must be an array`);
            let count = 0;
            const channelIds = new Set();
            for (const channel of doc.channels) {
              if (!channel.id || !channel.name) throw new Error(`${path}: channel missing id/name`);
              if (channelIds.has(String(channel.id))) throw new Error(`${path}: duplicate source channel id ${channel.id}`);
              channelIds.add(String(channel.id));
              if (!Array.isArray(channel.programmes)) throw new Error(`${path}: ${channel.id} programmes must be an array`);
              const programmeIds = new Set();
              for (const programme of channel.programmes) {
                count++;
                if (!programme.title?.trim()) throw new Error(`${path}: empty title in ${channel.id}`);
                const start = Date.parse(programme.start);
                const end = Date.parse(programme.end);
                if (!Number.isFinite(start) || !Number.isFinite(end) || start >= end) {
                  throw new Error(`${path}: invalid time range in ${channel.id}`);
                }
                if (programme.id && programmeIds.has(String(programme.id))) {
                  throw new Error(`${path}: duplicate programme id ${programme.id} in ${channel.id}`);
                }
                if (programme.id) programmeIds.add(String(programme.id));
              }
            }
            if (doc.coverage?.programmesFound !== count) {
              throw new Error(`${path}: coverage says ${doc.coverage?.programmesFound}, actual ${count}`);
            }
            checked++;
            console.log(`PASS ${path}: ${doc.channels.length} channels, ${count} programmes`);
          }
          if (!checked) throw new Error('No committed provider feed artifacts were validated');
          console.log(`Validated ${checked} committed provider feed artifacts`);
          NODE

