name: Validate provider feeds

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check beIN scraper syntax
        working-directory: providers/bein_mena
        run: npm run check
      - name: Test SuperSport adapter
        run: python -m unittest discover -s providers/supersport -p 'test_*.py'
      - name: Validate committed provider feeds
        run: |
          node -e "for (const p of ['data/source-feeds/bein_mena.json','data/review/supersport_unclassified.json']) { const d=require('./'+p); if(d.schemaVersion!==1) throw Error(p+' schemaVersion'); const n=d.channels.reduce((s,c)=>s+c.programmes.length,0); if(n!==d.coverage.programmesFound) throw Error(p+' coverage count'); console.log(p+': '+d.channels.length+' channels, '+n+' programmes') }"

